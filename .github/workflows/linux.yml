# Builds Hearth and runs its suite in each configuration it is checked in:
# GCC and Clang, Debug and Release, without zones, and the address,
# undefined-behaviour and thread sanitizers.
#
# hamr (the suite's test library) is checked out at the commit
# CMakeLists.txt pins; GLFW (TinyEngine's fork) and Vulkan-Headers are
# fetched at theirs. GLFW builds with its null platform only, so the runner
# needs no X11 or Wayland libraries and the suite no display.
name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc release,       cxx: g++,     type: Release }
          - { name: gcc debug,         cxx: g++,     type: Debug }
          - { name: clang release,     cxx: clang++, type: Release }
          - { name: no zones,          cxx: g++,     type: Debug,          flags: -DHEARTH_NO_ZONES=ON }
          - { name: address sanitizer, cxx: g++,     type: RelWithDebInfo, flags: -DHEARTH_SANITIZE=address }
          - { name: ub sanitizer,      cxx: g++,     type: RelWithDebInfo, flags: -DHEARTH_SANITIZE=undefined }
          - { name: thread sanitizer,  cxx: g++,     type: RelWithDebInfo, flags: -DHEARTH_SANITIZE=thread }
    steps:
      - uses: actions/checkout@v5

      - name: The pinned hamr commit
        id: pins
        run: echo "hamr=$(sed -n 's/^set(HEARTH_HAMR_COMMIT \([0-9a-f]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out hamr
        uses: actions/checkout@v5
        with:
          repository: Aosiee/hamr
          ref: ${{ steps.pins.outputs.hamr }}
          path: external/hamr

      # The sanitizers' shadow memory does not fit beside the runner's
      # default address randomisation.
      - name: Reduce address randomisation
        if: contains(matrix.flags, 'HEARTH_SANITIZE')
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          ${{ matrix.cxx }} --version
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DHEARTH_HAMR_DIR="$GITHUB_WORKSPACE/external/hamr" -DHEARTH_NULL_PLATFORM_ONLY=ON ${{ matrix.flags }}

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 10m build/hearth_tests
          timeout 10m build/hearth_platform_tests
          timeout 10m build/hearth_default_host_tests
